<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>范本引擎原型测试 v2 — 盒一</title>
<style>
  :root {
    --primary: #1a73e8;
    --border: #e0e0e0;
    --bg: #f5f6f8;
    --text: #1f2329;
    --muted: #8a919f;
    --danger: #d93025;
    --ok: #188038;
    --warn: #b06000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  .topbar {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 17px; }
  .topbar .hint { color: var(--muted); font-size: 12px; }
  .layout {
    display: grid; grid-template-columns: 380px 1fr; gap: 16px;
    padding: 16px 24px; max-width: 1500px; margin: 0 auto; height: calc(100vh - 56px);
  }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .panel-left { overflow-y: auto; }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .panel-body { padding: 14px 16px; }
  .section { margin-bottom: 18px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.5px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; margin-bottom: 3px; color: #444; }
  .field label .req { color: var(--danger); }
  .field input, .field select, .field textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 54px; line-height: 1.5; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,0.1); }
  .field .empty-mark { background: #fffdf5; border-style: dashed; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #1557b3; }
  .btn-outline { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-outline:hover { background: #f5f6f8; }
  .btn-block { width: 100%; justify-content: center; }
  .preview-toolbar { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
  .tab { padding: 6px 13px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 12px; font-family: inherit; }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .preview-body { flex: 1; overflow-y: auto; overflow-x: auto; background: #e8eaed; padding: 28px; display: block; }
  .paper-wrap { position: relative; margin: 0 auto; }
  .paper {
    background: #fff; width: 720px; min-height: 900px; padding: 56px 52px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    font-family: "SimSun", "宋体", serif; font-size: 14px; line-height: 1.9; color: #000;
    position: relative;
    /* 关键：纸张高度必须随内容增长，否则内容会溢出纸外（视觉上像跳出了框） */
    height: auto; align-self: flex-start; flex: 0 0 auto;
    overflow: visible;
  }
  .paper h2 { text-align: center; font-size: 21px; letter-spacing: 3px; margin-bottom: 18px; font-weight: normal; }
  .paper h3 { font-size: 15px; margin: 16px 0 6px; font-weight: bold; }
  .paper p { text-indent: 2em; margin: 5px 0; }
  .paper .no-indent { text-indent: 0; }
  .paper ol { padding-left: 2.6em; }
  .paper ol li { margin: 2px 0; }
  .sign-block { margin-top: 36px; }
  .sign-row { display: flex; justify-content: space-between; margin: 12px 0; }
  .sign-cell { min-width: 150px; }
  .sign-line { display: inline-block; min-width: 110px; border-bottom: 1px solid #000; padding: 0 6px; min-height: 1.15em; }
  .sign-line.filled { color: #1a4b8c; font-weight: bold; }
  .sign-line.empty { border-bottom-style: dashed; border-bottom-color: #aaa; }
  .fill-var { color: #1a4b8c; font-weight: bold; }
  .fill-empty { color: #aaa; border-bottom: 1px dashed #bbb; padding: 0 20px; }
  .hazard-item { margin: 5px 0; text-indent: 0; }
  .hazard-name { font-weight: bold; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 9px; margin-left: 5px; }
  .badge.merged { background: #e6f4ea; color: var(--ok); }
  .badge.split { background: #fce8e6; color: var(--danger); }
  .badge.auto { background: #e8f0fe; color: var(--primary); }

  /* ===== 标准圆形公章（SVG 弧形排字） =====
     规则（公文惯例）：章压在「公司落款列」的文字上，中心对齐该列文字行的中线，
     向右偏出约 40% 让出关键字。章随列走，不用任何像素级魔法偏移。 */
  .sign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; margin-top: 36px; }
  .sign-col .sign-line-item { margin: 12px 0; }
  /* 章锚定在公司名文字末尾（inline-block 收缩到文字实际宽度）：
     章心 = 文字末尾往回压 55px，章身向右下探出，压住「盖章」二字与日期上沿（骑年压月） */
  .seal-anchor { position: relative; display: inline-block; }
  .seal-on-line {
    position: absolute; left: calc(100% - 55px); top: 50%;
    transform: translate(-50%, -40%) rotate(-7deg);
    pointer-events: none; opacity: 0.88;
  }
  .seal-wrap {
    width: 148px; height: 148px; pointer-events: none;
  }
  .seal-box .seal-wrap { transform: none; opacity: 1; }
  .seal-wrap svg { width: 100%; height: 100%; display: block; }
  .seal-wrap.upload-seal {
    display: flex; align-items: center; justify-content: center;
    width: 148px; height: 148px; box-sizing: border-box;
    border: 2px dashed #d0021b; border-radius: 50%; color: #d0021b;
    background: rgba(208,2,27,0.05);
    font-size: 11px; line-height: 1.5; text-align: center; padding: 12px;
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
  }

  .tip { background: #fff8e1; border: 1px solid #f0d99a; border-radius: 8px; padding: 9px 11px; font-size: 12px; color: #7a5c00; margin-bottom: 14px; line-height: 1.6; }
  .tip b { color: #5a4400; }
  .note { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  /* 车辆类型选择 chip */
  .veh-chip {
    padding: 4px 10px; border-radius: 14px; border: 1px solid var(--border);
    background: #fafbfc; font-size: 12px; cursor: pointer; font-family: inherit;
    transition: all 0.12s;
  }
  .veh-chip:hover { border-color: var(--primary); }
  .veh-chip.active {
    background: var(--primary); border-color: var(--primary);
    color: #fff; font-weight: 600;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>范本引擎原型测试 v3</h1>
  <span class="hint">盒一「公司档案及管理层档案」— 8条反馈已修正 + 新增「车辆类型多选 → 制度包拼装」</span>
</div>

<div class="layout">
  <!-- 左：数据录入 -->
  <div class="panel panel-left">
    <div class="panel-header">① 录入关键信息</div>
    <div class="panel-body">

      <div class="tip">
        <b>v3 新增：车辆类型多选</b><br>
        企业勾选涉及的车型，系统自动拼装"通用制度 + 专项规程"。
      </div>

      <div class="section">
        <div class="section-title">营运类型 + 车辆类型（多选）</div>
        <div class="field">
          <label>营运类型</label>
          <select id="biz_type" onchange="onBizTypeChange()">
            <option value="GENERAL">普货（普通货物运输）</option>
            <option value="DANGER">危货（危险货物运输）</option>
          </select>
        </div>
        <div class="field">
          <label>涉及车辆类型 <span class="req">*</span>（多选）</label>
          <div id="vehTypeBox" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px"></div>
        </div>
        <div class="field" id="dangerClassField" style="display:none">
          <label>承运危险货物类别（多选，危货必填）</label>
          <div id="dangerClassBox" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">企业信息（企业级字段）</div>
        <div class="field"><label>企业全称 <span class="req">*</span></label>
          <input id="company_name" value="佛山市优成得物流有限公司"></div>
        <div class="field"><label>法定代表人</label>
          <input id="company_legal" value="马志勇"></div>
        <div class="field"><label>通讯地址 <span style="color:var(--muted)">（留空测试手填）</span></label>
          <input id="company_address" value="" placeholder="留空 → 打印时手填" class="empty-mark"></div>
      </div>

      <div class="section">
        <div class="section-title">人员信息（人员级字段）</div>
        <div class="field"><label>姓名 <span class="req">*</span></label>
          <input id="person_name" value="马志勇"></div>
        <div class="field"><label>岗位 <span class="req">*</span></label>
          <select id="person_post">
            <option value="主要负责人">主要负责人</option>
            <option value="安全员" selected>安全员</option>
            <option value="监控员">监控员</option>
            <option value="行政财务">行政财务</option>
            <option value="车辆技术管理员">车辆技术管理员</option>
            <option value="装卸管理员">装卸管理员</option>
            <option value="停车场管理员">停车场管理员</option>
            <option value="调度员">调度员</option>
            <option value="驾驶员">驾驶员</option>
            <option value="押运员">押运员</option>
          </select>
          <div class="note">管理岗才有任命书；驾驶员/押运员无任命书</div>
        </div>
        <div class="field"><label>直接上级（组织架构汇报关系）<span class="req">*</span></label>
          <input id="person_manager" value="马志勇（安全主要负责人）" placeholder="从组织架构读取"></div>
        <div class="field"><label>身份证号 <span style="color:var(--muted)">（留空测试手填）</span></label>
          <input id="person_idcard" value="" placeholder="留空 → 打印时手填" class="empty-mark"></div>
      </div>

      <div class="section">
        <div class="section-title">上下文字段</div>
        <div class="field"><label>年度</label><input id="year" value="2025"></div>
        <div class="field"><label>签订日期</label><input id="sign_date" value="2025-06-24"></div>
        <div class="field"><label>签字时间（告知书用）</label><input id="sign_time" value="2025-06-24"></div>
      </div>

      <div class="section">
        <div class="section-title">印章（所有台账都盖章）</div>
        <div class="field">
          <label>印章来源</label>
          <select id="seal_type" onchange="onSealTypeChange()">
            <option value="auto">② 系统自动生成圆形红章</option>
            <option value="upload">① 客户上传印章图</option>
            <option value="none">不盖章（测试对比）</option>
          </select>
          <div class="note">自动章：读取公司名生成红章；上传章：客户初始收集时上传</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-title">岗位内容库（可编辑，改后范本自动更新）</div>
        <div class="field"><label>当前岗位：<span id="cur_post_label" style="color:var(--primary);font-weight:bold"></span></label></div>
        <div class="field"><label>安全职责（每行一条，责任书引用）</label>
          <textarea id="post_duty"></textarea></div>
        <div class="field"><label>安全目标（每行一条，责任书引用）</label>
          <textarea id="post_target" style="min-height:44px"></textarea></div>
        <div class="field"><label>岗位危害（每行"名称|描述"，告知书引用）</label>
          <textarea id="post_hazard"></textarea></div>
      </div>

      <button class="btn btn-primary btn-block" onclick="renderAll()">生成范本预览</button>
      <div style="height:8px"></div>
      <button class="btn btn-outline btn-block" onclick="resetData()">重置为样例数据</button>
    </div>
  </div>

  <!-- 右：范本预览 -->
  <div class="panel panel-right">
    <div class="preview-toolbar">
      <span style="font-size:12px;color:var(--muted);margin-right:6px">② 预览：</span>
      <button class="tab active" data-tab="resp" onclick="switchTab('resp')">责任书 <span class="badge split">替换型</span></button>
      <button class="tab" data-tab="appoint" onclick="switchTab('appoint')">任命书 <span class="badge merged">增减型</span></button>
      <button class="tab" data-tab="hazard" onclick="switchTab('hazard')">岗位告知书 <span class="badge merged">列表</span></button>
      <button class="tab" data-tab="policy" onclick="switchTab('policy')">制度包拼装 <span class="badge auto">新</span></button>
    </div>
    <div class="preview-body">
      <div class="paper-wrap"><div class="paper" id="paper"></div></div>
    </div>
  </div>
</div>

<script>
// ============ 数据 ============
function getData() {
  return {
    company_name: v('company_name'),
    company_legal: v('company_legal'),
    company_address: v('company_address'),
    person_name: v('person_name'),
    person_post: v('person_post'),
    person_manager: v('person_manager'),
    person_idcard: v('person_idcard'),
    year: v('year'),
    sign_date: v('sign_date'),
    sign_time: v('sign_time'),
    seal_type: v('seal_type'),
  };
}
function v(id){ return document.getElementById(id).value; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fill(val){ return val && val.trim() ? '<span class="fill-var">'+esc(val)+'</span>' : '<span class="fill-empty"></span>'; }
function signCell(val){ return val && val.trim() ? '<span class="sign-line filled">'+esc(val)+'</span>' : '<span class="sign-line empty"></span>'; }

// ============ 岗位内容库（外置，可编辑） ============
const postContent = {
  '主要负责人': {

    target: ['发生一般以上生产安全责任事故0宗','百万车公里行车责任事故频率≤3宗','不发生火灾事故'],

    appoint: '为加强本公司安全生产管理工作，严格认真地落实安全生产工作，经公司研究决定任命 ',
    appointTitle: '主要负责人',
  },
  '安全员': {
    duty: ['负责公司安全生产工作日常管理工作；','组织或者参与拟订本单位安全生产规章制度、操作规程和生产安全事故应急救援预案；','组织或者参与本单位安全生产教育和培训，如实记录；','组织开展安全风险和危险源辨识、评估；','组织或者参与本单位应急救援演练；','组织安全生产岗位检查、日常安全检查和专业性安全检查；','制止和纠正违章指挥、强令冒险作业、违反操作规程的行为；','督促本单位履行安全生产职责、落实安全生产整改措施，组织安全生产考核；','协助组织召开安全生产工作会议；','协助组织开展安全文化建设及安全生产活动；','监督本公司安全生产资金投入和技术措施的落实；','组织劳动防护用品及应急救援物资的购置及使用管理；','协助组织事故抢险救援工作；','落实公司的职业健康管理工作；','负责安全生产统计与安全生产管理档案建立；','法律、法规、规章、规范、标准规定的其他安全生产管理职责。'],
    target: ['发生一般及以上生产安全责任事故0宗','隐患排查治理率100%','培训考核合格率100%'],

  },
  '监控员': {

    target: ['不发生火灾事故','卫星定位装置安装率100%','应急预案演练参与率100%'],

// ============ 标准圆形公章（SVG 弧形排字） ============
function renderSeal(companyName){
  const type = v('seal_type');
  if (type === 'none') return '';

  if (type === 'upload') {
    return `<div class="seal-wrap upload-seal">客户上传的<br>印章图<br>（占位）</div>`;
  }

  const name = (companyName || '公司名称').replace(/\s+/g, '');
  const chars = [...name];
  const n = chars.length;

  // 画布 200x200，圆心 100,100
  const cx = 100, cy = 100;
  const R = 68;                 // 文字基线半径
  const totalArc = 232;         // 上弧总角度（固定，字多则字小，符合真实公章）
  const startAngle = 270 - totalArc / 2;
  // 字号随字数自适应：字越多越小
  const fs = n <= 10 ? 22 : (n <= 14 ? 19 : (n <= 18 ? 16 : 13.5));
  const step = n > 1 ? totalArc / (n - 1) : 0;

  let nameText = '';
  for (let i = 0; i < n; i++) {
    const angle = startAngle + step * i;
    const rad = angle * Math.PI / 180;
    const x = cx + R * Math.cos(rad);
    const y = cy + R * Math.sin(rad);
    const rot = angle + 90;      // 字头朝外
    nameText += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" transform="rotate(${rot.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})" text-anchor="middle" dominant-baseline="central" font-family="SimSun,STSong,宋体,serif" font-size="${fs}" font-weight="700" fill="#d0021b">${esc(chars[i])}</text>`;
  }

  // 五角星（外接圆半径 22）
  const star = (() => {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? 24 : 9.4;
      const a = (-90 + i * 36) * Math.PI / 180;
      pts.push(`${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`);
    }
    return pts.join(' ');
  })();

  return `
    <div class="seal-wrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="92" fill="none" stroke="#d0021b" stroke-width="5"/>
        <circle cx="100" cy="100" r="86" fill="none" stroke="#d0021b" stroke-width="1"/>
        ${nameText}
        <polygon points="${star}" fill="#d0021b"/>
      </svg>
    </div>`;
}


// 公司落款印章：直接插在「公司名称」行内，章心锚定该行末尾（压字盖法，随文字走）
function sealLine(companyName){
  const seal = renderSeal(companyName);
  return seal ? `<span class="seal-on-line">${seal}</span>` : '';
}

    { code:'DAN_TOXIC', name:'剧毒化学品运输车', layer1:'D_BOX' },
    { code:'DAN_EXPL', name:'爆炸品运输车', layer1:'D_CYL' },
    { code:'DAN_COMP', name:'压缩气体运输车', layer1:'D_CYL' },
    { code:'DAN_LN2', name:'低温液体运输车', layer1:'D_TANK' },
  ],
};

// 普货 7 制度大类
const genGroups = {
  G1: { name:'厢式及封闭运输类', spec:'厢式及封闭运输专项操作规程' },
  G2: { name:'栏板及仓栅运输类', spec:'栏板及仓栅运输专项操作规程' },
  G3: { name:'集装箱及牵引运输类', spec:'集装箱及牵引运输专项操作规程' },
  G4: { name:'自卸及工程运输类', spec:'自卸及工程运输专项操作规程' },
  G5: { name:'罐体及散装物料运输类', spec:'罐体及散装物料运输专项操作规程' },
  G6: { name:'平板及大件运输类', spec:'平板及大件运输专项操作规程' },
  G7: { name:'专项功能运输类', spec:'专项功能运输操作规程' },
};

// 危货第一层：车辆结构与作业方式
const dangerLayer1 = {
  D_TANK: { name:'罐式', spec:'罐式危险货物运输专项操作规程' },
  D_BOX:  { name:'厢式包装', spec:'厢式包装危险货物运输专项操作规程' },
  D_CONT: { name:'集装箱', spec:'集装箱危险货物运输专项操作规程' },
  D_CYL:  { name:'气瓶', spec:'气瓶及压力容器运输专项操作规程' },
};

// 危货第二层：危险货物类别及特殊风险
const dangerClasses = [
  { code:'FLAM', name:'易燃液体', risk:'防火防爆、静电导除、泄漏围堵' },
  { code:'CORR', name:'腐蚀性物质', risk:'防腐蚀灼伤、专用防护、中和处置' },
  { code:'TOXIC', name:'毒害性物质', risk:'密闭防护、防毒面具、隔离警戒' },
  { code:'EXPL', name:'爆炸品', risk:'防静电防火、专人押运、专用路线' },
  { code:'RADIO', name:'放射性物品', risk:'辐射屏蔽、剂量监测、专业人员' },
  { code:'GAS', name:'气体（压缩/液化）', risk:'防超压泄漏、通风、禁火' },
  { code:'OXID', name:'氧化性物质', risk:'远离可燃物、防火防混装' },
];

// 选中状态
let selectedVeh = new Set(['GEN_BOX']);
let selectedDangerClass = new Set(['FLAM']);

function renderVehChips(){
  const biz = v('biz_type');
  const box = document.getElementById('vehTypeBox');
  const list = vehTypes[biz] || [];
  // 清除不属于当前类型的选中
  const validCodes = new Set(list.map(x=>x.code));
  selectedVeh.forEach(c => { if(!validCodes.has(c)) selectedVeh.delete(c); });

  box.innerHTML = list.map(t => {
    const on = selectedVeh.has(t.code) ? 'active' : '';
    return `<button class="veh-chip ${on}" onclick="toggleVeh('${t.code}')">${t.name}</button>`;
  }).join('');

  // 危货类别
  const dcField = document.getElementById('dangerClassField');
  if (biz === 'DANGER') {
    dcField.style.display = 'block';
    document.getElementById('dangerClassBox').innerHTML = dangerClasses.map(c => {
      const on = selectedDangerClass.has(c.code) ? 'active' : '';
      return `<button class="veh-chip ${on}" onclick="toggleDangerClass('${c.code}')">${c.name}</button>`;
    }).join('');
  } else {
    dcField.style.display = 'none';
  }
}

function toggleVeh(code){
  if (selectedVeh.has(code)) selectedVeh.delete(code);
  else selectedVeh.add(code);
  renderVehChips();
  if (currentTab === 'policy') renderAll();
}

function toggleDangerClass(code){
  if (selectedDangerClass.has(code)) selectedDangerClass.delete(code);
  else selectedDangerClass.add(code);
  renderVehChips();
  if (currentTab === 'policy') renderAll();
}

function onBizTypeChange(){
  // 切换营运类型时重置选中
  const biz = v('biz_type');
  selectedVeh = new Set(biz === 'GENERAL' ? ['GEN_BOX'] : ['DAN_TANK']);
  renderVehChips();
  if (currentTab === 'policy') renderAll();
}

// ============ 制度包拼装渲染 ============
function renderPolicy(d){
  const biz = v('biz_type');
  const isGen = biz === 'GENERAL';
  const list = vehTypes[biz] || [];

  // 收集命中的大类/层
  let hitGroups = [];
  if (isGen) {
    const gset = new Set();
    selectedVeh.forEach(c => {
      const t = list.find(x=>x.code===c);
      if (t) gset.add(t.group);
    });
    hitGroups = [...gset].sort();
  } else {
    const l1set = new Set();
    selectedVeh.forEach(c => {
      const t = list.find(x=>x.code===c);
      if (t) l1set.add(t.layer1);
    });
    hitGroups = [...l1set].sort();
  }

  // 选中的车型名称
  const selNames = [...selectedVeh].map(c => (list.find(x=>x.code===c)||{}).name).filter(Boolean);

  if (selectedVeh.size === 0) {
    return `<div style="padding:100px 20px;text-align:center;font-family:sans-serif;color:#888">
      <p style="text-indent:0;font-size:15px">请在左侧勾选「涉及车辆类型」</p>
      <p style="text-indent:0;font-size:13px;margin-top:8px">系统会根据勾选自动拼装制度包</p>
    </div>`;
  }

  // 第一层：通用制度
  let html = `
    <div style="font-family:-apple-system,'PingFang SC',sans-serif">
      <h2 style="text-align:left;font-size:19px;letter-spacing:0;border-bottom:2px solid #1a73e8;padding-bottom:10px;margin-bottom:6px">
        安全生产制度包
      </h2>
      <p style="text-indent:0;color:#666;font-size:12.5px;margin-bottom:6px">
        企业：<b style="color:#1a4b8c">${esc(d.company_name)}</b>　
        营运类型：<b>${isGen?'普货':'危货'}</b>　
        涉及车型：<b>${selNames.join('、')}</b>
      </p>
      ${!isGen ? `<p style="text-indent:0;color:#666;font-size:12.5px;margin-bottom:14px">
        承运货物类别：<b style="color:#d93025">${[...selectedDangerClass].map(c=>(dangerClasses.find(x=>x.code===c)||{}).name).filter(Boolean).join('、')||'未选'}</b>
      </p>` : '<div style="height:10px"></div>'}

      <div style="background:#e8f0fe;border-left:4px solid #1a73e8;padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:14px">
        <div style="font-weight:700;font-size:13.5px;color:#1a73e8;margin-bottom:4px">① 通用制度层</div>
        <div style="font-size:13px">安全生产管理制度（通用）</div>
        <div style="font-size:11.5px;color:#5a7db8;margin-top:3px">所有企业共用 1 套，不因车型变化</div>
      </div>

      <div style="background:#fce8e6;border-left:4px solid #d93025;padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:14px">
        <div style="font-weight:700;font-size:13.5px;color:#d93025;margin-bottom:6px">② 专项规程层（按勾选拼装）</div>`;

  if (isGen) {
    // 普货：7 大类
    hitGroups.forEach(g => {
      const grp = genGroups[g];
      const cov = list.filter(t=>t.group===g && selectedVeh.has(t.code)).map(t=>t.name);
      html += `<div style="background:#fff;border:1px solid #f5c6c0;padding:8px 12px;border-radius:6px;margin-bottom:6px">
        <div style="font-size:13px;font-weight:600">${grp.spec}</div>
        <div style="font-size:11.5px;color:#888;margin-top:2px">覆盖：${cov.join('、')}</div>
      </div>`;
    });
  } else {
    // 危货：第一层
    hitGroups.forEach(l1 => {
      const grp = dangerLayer1[l1];
      const cov = list.filter(t=>t.layer1===l1 && selectedVeh.has(t.code)).map(t=>t.name);
      html += `<div style="background:#fff;border:1px solid #f5c6c0;padding:8px 12px;border-radius:6px;margin-bottom:6px">
        <div style="font-size:13px;font-weight:600">${grp.spec}</div>
        <div style="font-size:11.5px;color:#888;margin-top:2px">第一层·${grp.name}｜覆盖：${cov.join('、')}</div>
      </div>`;
    });
    // 第二层：货物类别
    if (selectedDangerClass.size) {
      html += `<div style="margin-top:8px;padding:8px 12px;background:#fff3f2;border:1px dashed #e8a19a;border-radius:6px">
        <div style="font-size:12px;font-weight:600;color:#b3261e;margin-bottom:4px">第一层 × 第二层 交叉装配</div>`;
      selectedDangerClass.forEach(c => {
        const dc = dangerClasses.find(x=>x.code===c);
        if (dc) html += `<div style="font-size:12px;margin:3px 0">＋ ${dc.name}专项条款 <span style="color:#888;font-size:11px">（${dc.risk}）</span></div>`;
      });
      html += `</div>`;
    }
  }

  html += `</div>

      <div style="background:#f5f6f8;border-left:4px solid #c5cad3;padding:10px 14px;border-radius:0 8px 8px 0">
        <div style="font-weight:700;font-size:13.5px;color:#666;margin-bottom:4px">③ 附件层</div>
        <div style="font-size:12.5px;color:#888">特殊业务通过附件补充，不重做整套制度</div>
      </div>

      <div style="margin-top:18px;padding:10px 12px;background:#fffbe6;border:1px solid #f0d99a;border-radius:8px;font-size:11.5px;color:#7a5c00;line-height:1.7">
        <b>拼装小结</b>：通用制度 1 套 + 专项规程 ${hitGroups.length} 套${!isGen && selectedDangerClass.size ? ' + 货物类别条款 ' + selectedDangerClass.size + ' 项' : ''}
        <br>新增车型时只需判断归入哪个大类，<b>无须重新编制整套制度</b>。
      </div>
    </div>`;
  return html;
}


let currentTab = 'resp';

function renderAll(){
  savePostContent();
  const d = getData();
  const paper = document.getElementById('paper');
  if (currentTab === 'resp') paper.innerHTML = renderResp(d);
  else if (currentTab === 'appoint') paper.innerHTML = renderAppoint(d);
  else if (currentTab === 'hazard') paper.innerHTML = renderHazard(d);
  else paper.innerHTML = renderPolicy(d);
  paper.closest('.preview-body').scrollTop = 0;
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  renderAll();
}
