<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>小程序·学习中心</title>
<link rel="stylesheet" href="../assets/mini.css"></head>
<body>
<div class="mini-shell">
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>电量 100%</span></div>
  <div class="nav-title"><span class="back">‹</span>学习中心</div>
  <div class="content">
    <!-- 学习进度 -->
    <div class="mini-card" style="background:linear-gradient(120deg,#1E40AF,#2563EB);color:#fff">
      <div style="font-size:17px;font-weight:700;margin-bottom:8px">本月学习进度</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="font-size:34px;font-weight:800">78%</div>
        <div style="flex:1"><div style="font-size:14px;opacity:.9">已完成 3 课 · 还差 1 课</div>
          <div style="height:10px;background:rgba(255,255,255,.25);border-radius:10px;margin-top:8px;overflow:hidden"><div style="height:100%;width:78%;background:#fff;border-radius:10px"></div></div>
        </div>
      </div>
    </div>

    <div class="mini-card-title">继续学习</div>
    <!-- 未完成课程（醒目）-->
    <div class="task-item" style="border:2px solid #1E40AF">
      <div class="t-ico" style="width:56px;height:56px;border-radius:12px;background:#DBEAFE;color:#1E40AF;display:flex;align-items:center;justify-content:center"><span class="ico" data-icon="video"></span></div>
      <div class="t-info"><div class="t-title">冬季行车安全要点</div><div class="t-desc" style="color:#64748B">还剩 8 分钟 · 看完才算完成</div></div>
      <button class="mini-btn mini-btn-primary" style="width:auto;min-height:44px;padding:0 16px;font-size:16px">接着看</button>
    </div>

    <div class="mini-card-title" style="margin-top:18px">全部课程</div>
    <!-- 已完成课程 -->
    <div class="task-item">
      <div class="t-ico" style="width:56px;height:56px;border-radius:12px;background:#eefbf1;color:#15803D;display:flex;align-items:center;justify-content:center"><span class="ico" data-icon="checkCircle"></span></div>
      <div class="t-info"><div class="t-title">防御性驾驶技巧</div><div class="t-desc" style="color:#64748B">已完成 · 20 分钟</div></div>
      <span class="tag tag-green">已学完</span>
    </div>
    <div class="task-item">
      <div class="t-ico" style="width:56px;height:56px;border-radius:12px;background:#eefbf1;color:#15803D;display:flex;align-items:center;justify-content:center"><span class="ico" data-icon="checkCircle"></span></div>
      <div class="t-info"><div class="t-title">危化品应急处置</div><div class="t-desc" style="color:#64748B">已完成 · 15 分钟</div></div>
      <span class="tag tag-green">已学完</span>
    </div>
    <div class="task-item">
      <div class="t-ico" style="width:56px;height:56px;border-radius:12px;background:#F8FAFC;color:#64748B;display:flex;align-items:center;justify-content:center"><span class="ico" data-icon="bookOpen"></span></div>
      <div class="t-info"><div class="t-title">新《安全生产法》解读</div><div class="t-desc" style="color:#64748B">未开始 · 25 分钟</div></div>
      <span class="tag tag-gray">待学习</span>
    </div>
  </div>
  <div class="tabbar">
    <div class="tab"><span class="ico" data-icon="home"></span>首页</div>
    <div class="tab"><span class="ico" data-icon="clipboard"></span>三检</div>
    <div class="tab active"><span class="ico" data-icon="bookOpen"></span>学习</div>
    <div class="tab"><span class="ico" data-icon="user"></span>我的</div>
  </div>
</div>
</div>
<script src="../assets/icons.js"></script>
</body>
</html>
