<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>小程序·登录</title>
<link rel="stylesheet" href="../assets/mini.css"></head>
<body>
<div class="mini-shell">
<div class="phone">
  <div class="content" style="display:flex;flex-direction:column;justify-content:center;min-height:720px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:72px;height:72px;border-radius:18px;background:#ff7a00;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto"><span class="ico" data-icon="truck"></span></div>
      <div style="font-size:26px;font-weight:800;margin-top:14px">运管管</div>
      <div class="mini-text-sm" style="margin-top:6px;color:#6b7a8d">道路运输安全服务 · 内部使用</div>
    </div>

    <div style="margin-bottom:14px">
      <div style="font-size:16px;color:#4a5a6e;margin-bottom:6px;font-weight:600">手机号</div>
      <input style="width:100%;height:54px;border:2px solid #d0d7e0;border-radius:12px;padding:0 16px;font-size:18px" placeholder="请输入手机号">
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:16px;color:#4a5a6e;margin-bottom:6px;font-weight:600">密码</div>
      <input type="password" style="width:100%;height:54px;border:2px solid #d0d7e0;border-radius:12px;padding:0 16px;font-size:18px" placeholder="请输入密码">
    </div>
    <div style="margin-bottom:20px">
      <div style="font-size:16px;color:#4a5a6e;margin-bottom:6px;font-weight:600">选择企业</div>
      <select style="width:100%;height:54px;border:2px solid #d0d7e0;border-radius:12px;padding:0 16px;font-size:17px">
        <option>佛山市南海区小塘塘安运输服务有限公司</option>
        <option>李志豪3（培训机构）</option>
      </select>
    </div>

    <button class="mini-btn mini-btn-primary" style="height:58px;font-size:20px">登 录</button>

    <div style="display:flex;justify-content:space-between;margin-top:18px;font-size:15px;color:#6b7a8d">
      <span>忘记密码</span><span>联系客服</span><span>随便看看</span>
    </div>
  </div>
</div>
</div>
<script src="../assets/icons.js"></script>
</body>
</html>
