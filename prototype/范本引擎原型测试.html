<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>范本引擎原型测试 — 盒一</title>
<style>
  :root {
    --primary: #1a73e8;
    --border: #e0e0e0;
    --bg: #f5f6f8;
    --text: #1f2329;
    --muted: #8a919f;
    --danger: #d93025;
    --ok: #188038;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar h1 { font-size: 18px; }
  .topbar .hint { color: var(--muted); font-size: 13px; }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
    padding: 16px 24px;
    max-width: 1400px;
    margin: 0 auto;
    height: calc(100vh - 60px);
  }
  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-left { overflow-y: auto; }
  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-body { padding: 16px; }
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    color: #444;
  }
  .field label .req { color: var(--danger); }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(26,115,232,0.1);
  }
  .field input.empty-field {
    background: #fffdf5;
    border-style: dashed;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #1557b3; }
  .btn-outline { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-outline:hover { background: #f5f6f8; }
  .btn-block { width: 100%; justify-content: center; }
  .btn-group { display: flex; gap: 8px; }

  /* 右侧预览区 */
  .panel-right { position: relative; }
  .preview-toolbar {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tab {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .preview-body {
    flex: 1;
    overflow-y: auto;
    background: #e8eaed;
    padding: 30px;
    display: flex;
    justify-content: center;
  }
  /* A4 纸张模拟 */
  .paper {
    background: #fff;
    width: 720px;
    min-height: 900px;
    padding: 60px 55px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    font-family: "SimSun", "宋体", serif;
    font-size: 14px;
    line-height: 1.9;
    color: #000;
  }
  .paper h2 { text-align: center; font-size: 22px; letter-spacing: 3px; margin-bottom: 20px; font-weight: normal; }
  .paper h3 { font-size: 15px; margin: 18px 0 8px; font-weight: bold; }
  .paper p { text-indent: 2em; margin: 6px 0; }
  .paper .no-indent { text-indent: 0; }
  .paper ol { padding-left: 3em; }
  .paper ol li { margin: 3px 0; text-indent: 0; }
  .sign-block { margin-top: 40px; }
  .sign-row { display: flex; justify-content: space-between; margin: 14px 0; }
  .sign-cell { text-align: center; min-width: 140px; }
  .sign-line { display: inline-block; min-width: 120px; border-bottom: 1px solid #000; padding: 0 8px; min-height: 1.2em; }
  .sign-line.filled { color: #1a4b8c; font-weight: bold; }
  .sign-line.empty { border-bottom-style: dashed; border-bottom-color: #999; }
  .fill-var { color: #1a4b8c; font-weight: bold; }
  .fill-empty { color: #999; border-bottom: 1px dashed #bbb; }
  .hazard-item { margin: 6px 0; }
  .hazard-name { font-weight: bold; }

  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .badge.merged { background: #e6f4ea; color: var(--ok); }
  .badge.split { background: #fce8e6; color: var(--danger); }

  .tip {
    background: #fff8e1;
    border: 1px solid #f0d99a;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: #7a5c00;
    margin-bottom: 16px;
  }
</style>
</head>

    </div>

    <div class="preview-body">

  </div>
</div>

// 填充函数：有值填值，无值显示空栏（留空手填）
function fill(val) {
  if (val && val.trim() !== '') {
    return '<span class="fill-var">' + escapeHtml(val) + '</span>';
  }
  return '<span class="fill-empty">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 签字栏：有签字图则填充，否则空栏
function signCell(val) {
  if (val) return '<span class="sign-line filled">' + escapeHtml(val) + '</span>';
  return '<span class="sign-line empty"></span>';
}

function renderResp(d) {

  let relation;
  if (isMain) relation = '公司与主要负责人';
  else if (d.person_post === '驾驶员') relation = '安全员与驾驶员';
  else relation = '安全主要负责人与' + d.person_post;

  let dutyItems = respDuty[d.person_post] || respDuty['驾驶员'];
  let dutyHtml = dutyItems.map(x => '<li>' + x + '</li>').join('');

  let signHtml;
  if (isMain) {
    // 单边签字
    signHtml = `
      <div class="sign-row"><span class="sign-cell">责任主体：${fill(d.company_name)}　责任人：${d.person_post}</span></div>
      <div class="sign-row">
        <span class="sign-cell">盖章：${signCell('')}</span>
        <span class="sign-cell">签字：${signCell(d.person_name)}</span>
      </div>
      <div class="sign-row">
        <span class="sign-cell">日期：${fill(d.sign_date)}</span>
        <span class="sign-cell">日期：${fill(d.sign_date)}</span>
      </div>`;
  } else {
    // 双边签字
    const managerPost = d.person_post === '驾驶员' ? '安全员' : '安全主要负责人';
    signHtml = `
      <div class="sign-row"><span class="sign-cell">责任管理人：${managerPost}</span><span class="sign-cell">责任人：${d.person_post}</span></div>
      <div class="sign-row">
        <span class="sign-cell">签字：${signCell('')}</span>
        <span class="sign-cell">签字：${signCell(d.person_name)}</span>
      </div>
      <div class="sign-row">
        <span class="sign-cell">日期：${fill(d.sign_date)}</span>
        <span class="sign-cell">日期：${fill(d.sign_date)}</span>
      </div>`;
  }

  return `
    <h2>${title}</h2>
    <p>遵循"安全第一，预防为主，综合治理"的安全方针...按照公司《安全生产责任制》要求，
    ${relation}签订${d.year}年年度《安全生产责任书》，履行公司责任制规定的${d.person_post}的安全生产责任。</p>
    <h3>一、安全生产目标</h3>
    <p class="no-indent">1、责任事故控制指标</p>
    <ol><li>发生一般及以上生产安全责任事故0宗；</li><li>不发生火灾事故。</li></ol>
    <p class="no-indent">2、运输安全管理工作指标</p>
    <ol><li>职业病防护率100%；</li><li>隐患排查治理率100%；</li><li>培训考核合格率100%。</li></ol>
    <h3>二、安全职责</h3>
    <ol>${dutyHtml}</ol>
    <h3>三、责任制考评与奖惩</h3>
    <p>公司按照绩效考核方案对责任落实进行考评...触犯法律的，交由司法机关处理。</p>
    <h3>四、其他</h3>
    <p>（一）本责任书签订人因工作变动，由继任人在任职当日起继续签订本年度责任书；</p>
    <p>（二）本安全生产责任书期限为一年。</p>
    <p>（三）本责任书一式贰份，公司与签订人各一份。</p>
    <div class="sign-block">${signHtml}</div>`;
}

// ============ 任命书（增减型·合并范本） ============
const appointIntro = {
  '主要负责人': '为加强本公司安全生产管理工作，严格认真地落实安全生产工作，经公司研究决定任命 ',
  '安全员': '为加强本公司安全生产管理工作，严格认真地落实安全生产，做好制度和操作规程管理、安全投入、教育培训、现场检查等规范管理工作，经公司研究决定任命 ',
  '监控员': '为了进一步加强企业安全生产管理，做好公司车辆动态监控管理工作，经公司研究决定，现任命 ',
  '驾驶员': '为加强本公司安全生产管理工作，严格认真地落实安全生产工作，经公司研究决定任命 ',
  '行政财务': '为加强本公司安全生产管理工作，严格认真地落实安全生产，做好财务规范化管理以及公司日常行政管理等工作，经公司研究决定任命 ',
};
const appointPostTitle = {
  '主要负责人': '主要负责人',
  '安全员': '专职安全生产管理人员',
  '监控员': '监控人员',
  '驾驶员': '驾驶员',
  '行政财务': '财务人员',
};

function renderAppoint(d) {
  const name = d.person_name;
  const postTitle = appointPostTitle[d.person_post] || d.person_post;
  const intro = appointIntro[d.person_post] || appointIntro['驾驶员'];
  // 是否带公司名前缀（安全员/监控员带）
  const needPrefix = (d.person_post === '安全员' || d.person_post === '监控员');

  return `
    <h2>关于任命${postTitle}的通知</h2>
    ${needPrefix ? '<p class="no-indent" style="text-align:center">' + fill(d.company_name) + '</p>' : ''}
    <p>公司全体人员：</p>
    <p>${intro}${fill(name)} ${d.person_post === '安全员' ? '同志担任公司安全员，作为公司专职安全生产管理人员，负责公司安全生产监督管理工作。' : '为公司' + postTitle + '。'}</p>
    <p>特此通知。</p>
    <div class="sign-block" style="text-align:right">
      <div>公司：${fill(d.company_name)}</div>
      <div>生效日期：${fill(d.sign_date)}</div>
    </div>`;
}

// ============ 岗位告知书（增减型·列表变量） ============
function renderHazard(d) {
  const list = hazardData[d.person_post] || [];
  const items = list.map(h => `
    <div class="hazard-item"><span class="hazard-name">${h.name}</span>：${h.desc}</div>
  `).join('');

  return `
    <h2>岗位职业病危害因素告知书</h2>
    <p>根据《中华人民共和国职业病防治法》有关规定要求，我公司将工作过程中可能接触的职业病危害因素、可能产生的职业病危害及其后果、职业病防护措施和待遇等如实告知您。</p>
    <p>现在您在我公司${d.person_post}岗位任职工作，在此岗位任职期间，公司将按照国家有关规定，对您发放相关安全防护用品，并向您告知该岗位存在职业病危害因素及相关职业病防护措施，具体如下：</p>
    <h3>1、岗位危害</h3>
    ${items}
    <h3>2、防护措施</h3>
    <p>（1）适当增加活动量，定时休息，避免久坐；</p>
    <p>（2）饮食有节，定时进餐，生活有规律。</p>
    <p>一旦发生职业病，本单位将按照国家有关法律、法规，为您提供相应待遇。</p>
    <p>同时，您有履行以下规定的义务：自觉遵守本岗位职业卫生操作规程和制度，正确使用职业病防护设备和个人职业病防护用品，积极参加职业卫生知识培训。</p>
    <div class="sign-block">
      <div class="sign-row"><span class="sign-cell">公司名称（盖章）：${fill(d.company_name)}</span></div>
      <div class="sign-row">
        <span class="sign-cell">告知时间：${fill(d.sign_date)}</span>
        <span class="sign-cell">签字时间：${fill('')}</span>
      </div>
      <div class="sign-row">
        <span class="sign-cell">被告知人（签字）：${signCell(d.person_name)}</span>
      </div>
    </div>`;
}

// ============ 渲染控制 ============
let currentTab = 'resp';
function renderAll() {
  const d = getData();
  const paper = document.getElementById('paper');
  if (currentTab === 'resp') paper.innerHTML = renderResp(d);
  else if (currentTab === 'appoint') paper.innerHTML = renderAppoint(d);
  else paper.innerHTML = renderHazard(d);
  // 滚动预览到顶部
  paper.closest('.preview-body').scrollTop = 0;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  renderAll();
}

function resetData() {
  document.getElementById('company_name').value = '佛山市优成得物流有限公司';
  document.getElementById('company_legal').value = '马志勇';
  document.getElementById('company_address').value = '';
  document.getElementById('person_name').value = '马志勇';
  document.getElementById('person_post').value = '驾驶员';
  document.getElementById('person_idcard').value = '';
  document.getElementById('year').value = '2025';
  document.getElementById('sign_date').value = '2025-06-24';
  renderAll();
}

// 输入变化实时刷新（体验变量填充）
['company_name','company_legal','company_address','person_name','person_idcard','year','sign_date'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderAll);
});
document.getElementById('person_post').addEventListener('change', renderAll);

// 初始渲染
renderAll();
</script>
</body>
</html>
