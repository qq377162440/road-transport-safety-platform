<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>动态监控</title>
<link rel="stylesheet" href="../assets/common.css"><link rel="stylesheet" href="../assets/pc.css">
<style></style></head><body>
<div class="pc-page">
<div class="pc-header"><div><h1>动态监控</h1><div class="desc">车辆动态监控（模拟数据演示）</div></div><div class="actions"><button class="btn btn-outline"><span class="ico" data-icon="setting"></span> 监控设置</button></div></div><div class="stat-grid">
    <div class="stat-card"><div class="ic" style="background:var(--brand-100);color:var(--brand-500)">{ico("truck",24)}</div><div><div class="val">86</div><div class="lbl">在线车辆</div></div></div>
    <div class="stat-card"><div class="ic" style="background:var(--warn-bg);color:var(--warn)">{ico("alertTriangle",24)}</div><div><div class="val">3</div><div class="lbl">今日预警</div></div></div>
    <div class="stat-card"><div class="ic" style="background:var(--danger-bg);color:var(--danger)">{ico("alert",24)}</div><div><div class="val">1</div><div class="lbl">待处理</div></div></div>
    <div class="stat-card"><div class="ic" style="background:var(--ok-bg);color:var(--ok)">{ico("checkCircle",24)}</div><div><div class="val">12</div><div class="lbl">今日已处置</div></div></div>
    </div><div class="filter-bar"><div class="f-item"><label>车辆</label><input type="text" placeholder="请输入车牌"></div><div class="f-item"><label>预警等级</label><select><option>全部</option><option>严重</option><option>一般</option><option>提示</option></select></div><div class="f-actions"><button class="btn btn-primary btn-sm"><span class="ico" data-icon="search"></span> 查询</button><button class="btn btn-outline btn-sm">重置</button></div></div><div class="card" style="padding:0;overflow:hidden"><table class="table"><thead><tr><th>车辆</th><th>事件类型</th><th>预警等级</th><th>发生时间</th><th>处理状态</th><th>操作</th></tr></thead><tbody><tr><td>粤E·12345</td><td>超速预警</td><td><span class="tag tag-red">严重</span></td><td>2026-10-27 09:35:12</td><td><span class="tag tag-red">待处理</span></td><td><a class="btn btn-primary btn-sm">处理</a> </td></tr><tr><td>粤E·67890</td><td>疲劳驾驶</td><td><span class="tag tag-yellow">一般</span></td><td>2026-10-27 08:20:44</td><td><span class="tag tag-blue">已提醒</span></td><td><a class="btn btn-primary btn-sm">处理</a> </td></tr><tr><td>粤E·54321</td><td>偏离路线</td><td><span class="tag tag-blue">提示</span></td><td>2026-10-27 07:58:03</td><td><span class="tag tag-green">已处理</span></td><td><a class="btn btn-primary btn-sm">详情</a> </td></tr></tbody></table>
<div class="table-foot"><span>共 3 条记录</span>
<div class="pagination"><button>&lt;</button><button class="active">1</button><button>2</button><button>3</button><button>…</button><button>&gt;</button></div></div></div>
</div>
<script src="../assets/icons.js"></script></body></html>
