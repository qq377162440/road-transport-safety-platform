<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>企业档案柜</title>
<link rel="stylesheet" href="../assets/common.css"><link rel="stylesheet" href="../assets/pc.css">
<style>.arch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.arch-card{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);display:flex;align-items:center;gap:14px}.arch-card .a-ico{width:52px;height:52px;border-radius:12px;background:var(--brand-100);color:var(--brand-500);display:flex;align-items:center;justify-content:center}.arch-card .a-name{font-size:16px;font-weight:700}.arch-card .a-desc{font-size:13px;color:var(--text-3);margin-top:2px}.arch-card .btn{margin-left:auto}</style></head><body>
<div class="pc-page">
<div class="pc-header"><div><h1>企业档案柜</h1><div class="desc">企业安全生产档案集中管理</div></div><div class="actions"><button class="btn btn-primary"><span class="ico" data-icon="plus"></span> 新建档案</button></div></div><div class="arch-grid"><div class="arch-card"><div class="a-ico"><span class="ico" style="font-size:30px" data-icon="truck"></span></div>
        <div><div class="a-name">车辆档案</div><div class="a-desc">128 份 · 一车一档</div></div>
        <a class="btn btn-outline btn-sm"><span class="ico" data-icon="folder"></span> 打开</a></div><div class="arch-card"><div class="a-ico"><span class="ico" style="font-size:30px" data-icon="user"></span></div>
        <div><div class="a-name">人员档案</div><div class="a-desc">86 份 · 一人一档</div></div>
        <a class="btn btn-outline btn-sm"><span class="ico" data-icon="folder"></span> 打开</a></div><div class="arch-card"><div class="a-ico"><span class="ico" style="font-size:30px" data-icon="fileText"></span></div>
        <div><div class="a-name">制度档案</div><div class="a-desc">42 份 · 制度/规程</div></div>
        <a class="btn btn-outline btn-sm"><span class="ico" data-icon="folder"></span> 打开</a></div><div class="arch-card"><div class="a-ico"><span class="ico" style="font-size:30px" data-icon="shield"></span></div>
        <div><div class="a-name">隐患台账</div><div class="a-desc">156 条 · 排查整改</div></div>
        <a class="btn btn-outline btn-sm"><span class="ico" data-icon="folder"></span> 打开</a></div><div class="arch-card"><div class="a-ico"><span class="ico" style="font-size:30px" data-icon="clipboard"></span></div>
        <div><div class="a-name">三检记录</div><div class="a-desc">2048 条 · 一日三检</div></div>
        <a class="btn btn-outline btn-sm"><span class="ico" data-icon="folder"></span> 打开</a></div><div class="arch-card"><div class="a-ico"><span class="ico" style="font-size:30px" data-icon="award"></span></div>
        <div><div class="a-name">考核档案</div><div class="a-desc">64 份 · 奖惩考核</div></div>
        <a class="btn btn-outline btn-sm"><span class="ico" data-icon="folder"></span> 打开</a></div></div>
</div>
<script src="../assets/icons.js"></script></body></html>
