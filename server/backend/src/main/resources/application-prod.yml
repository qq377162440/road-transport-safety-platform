# 生产环境 profile（A3：敏感配置外置，无硬编码密钥）
#
# 启用方式：SPRING_PROFILES_ACTIVE=prod
# 下列占位符均无默认值：任一缺失，应用启动即失败，避免带着开发凭据上线。
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

safetrans:
  jwt:
    secret: ${JWT_SECRET}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}

logging:
  level:
    com.safetrans: info
    org.flywaydb: warn

# 生产环境强制关闭开发免密登录
app:
  dev-login-enabled: false
