# ============================================================================
# 道路运输安全生产管理平台 · 生产编排（E1）
#
# 用法（在 server/deploy 目录）：
#   cp .env.example .env && vi .env          # 全部必填项必须覆盖
#   DOMAIN=your.domain ./render_nginx_conf.sh
#   ./certs/gen_selfsigned_cert.sh           # 仅演练；生产放入真实证书
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 与开发编排（docker-compose.yml）的差异，逐项可审计：
#   1. 启用 SPRING_PROFILES_ACTIVE=prod，application-prod.yml 所有凭据无默认值
#   2. 所有 ${VAR:?} 凭据缺失即启动失败，杜绝带开发默认值上线
#   3. 仅 frontend 暴露 80/443；mysql/redis/minio/backend 不映射宿主机端口
#   4. 强制 HTTPS（HTTP 301 跳转），TLS 1.2+，HSTS 与安全响应头
#   5. 每服务资源上限/预留（资源规格确认）+ json-file 日志轮转
#   6. restart: always（开发为 unless-stopped）
#
# 注意：本文件是独立完整编排，不用 overlay 合并，避免开发默认值被继承。
# ============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: safetrans-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-safetrans}
      MYSQL_USER: ${MYSQL_USER:?必须在 .env 设置 MYSQL_USER（生产禁用 root 直连）}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }
        reservations: { cpus: '0.5', memory: 1G }
    logging: &logging
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: safetrans-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须在 .env 设置 REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }
    logging: *logging

  minio:
    image: minio/minio:latest
    container_name: safetrans-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?必须在 .env 设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须在 .env 设置 MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }
        reservations: { cpus: '0.2', memory: 256M }
    logging: *logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: safetrans/backend:${IMAGE_TAG:-latest}
    container_name: safetrans-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-safetrans}
      MYSQL_USER: ${MYSQL_USER:?必须在 .env 设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 设置 MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须在 .env 设置 REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?必须在 .env 设置 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?必须在 .env 设置 MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 设置 JWT_SECRET（≥32 字节随机串）}
      TZ: Asia/Shanghai
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }
        reservations: { cpus: '0.5', memory: 1G }
    logging: *logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: safetrans/frontend:${IMAGE_TAG:-latest}
    container_name: safetrans-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 渲染后的生产 nginx 配置（render_nginx_conf.sh 产出，已 gitignore）
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录：fullchain.pem / privkey.pem（已 gitignore）
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 64M }
    logging: *logging

volumes:
  mysql-data:
    name: safetrans-mysql-data
  redis-data:
    name: safetrans-redis-data
  minio-data:
    name: safetrans-minio-data
